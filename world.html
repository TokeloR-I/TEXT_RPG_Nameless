<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enso's Last Stand — The Forgotten Homestead</title>
    <link rel="stylesheet" href="world.css">
</head>
<body>
    <main class="world-shell">
        <div class="world-stage" id="world-stage">
            <canvas id="world-canvas" width="480" height="270" aria-label="Game world"></canvas>
            <div id="hud" class="hud" hidden></div>
            <div id="banner" class="banner" hidden></div>
            <div id="dialog" class="dialog" role="dialog" aria-live="polite" hidden></div>
            <div id="pause" class="panel" role="dialog" aria-label="Menu" hidden></div>
            <div id="combat" class="combat" role="dialog" aria-label="Battle" hidden></div>
            <div id="toast" class="toast" role="status" hidden></div>
            <div id="prompt" class="prompt" role="status" hidden></div>
            <div id="title" class="title-screen"></div>
            <pre id="problems" class="problems" hidden></pre>
        </div>
        <div id="touch-pad" class="touch-pad" hidden>
            <div class="dpad">
                <button data-key="ArrowUp" aria-label="Up">▲</button>
                <button data-key="ArrowLeft" aria-label="Left">◀</button>
                <button data-key="ArrowRight" aria-label="Right">▶</button>
                <button data-key="ArrowDown" aria-label="Down">▼</button>
            </div>
            <div class="pad-actions">
                <button data-key="e" aria-label="Interact">E</button>
                <button data-key="Escape" aria-label="Menu">Esc</button>
            </div>
        </div>
        <p class="world-help">WASD move and face · click aims · 1 attacks forward · 2–6, R skills · Space dodge · Shift sprint · Q / right-click guard · E interact · Esc menu · <a href="index.html">classic text version</a></p>
    </main>
    <!-- Engine (no DOM) -->
    <script src="src/data.js"></script>
    <script src="src/effects.js"></script>
    <script src="src/statuses.js"></script>
    <script src="src/engine/util.js"></script>
    <script src="src/engine/exploration.js"></script>
    <script src="src/engine/combat.js"></script>
    <script src="src/engine/combat-input.js"></script>
    <script src="src/engine/skills.js"></script>
    <script src="src/engine/progression.js"></script>
    <script src="src/engine/world.js"></script>
    <script src="src/engine/actions.js"></script>
    <script src="src/engine/timers.js"></script>
    <script src="src/engine/control.js"></script>
    <script src="src/engine/turn-order.js"></script>
    <script src="src/engine/story.js"></script>
    <script src="src/engine/save.js"></script>
    <script src="src/story/chapter1.js"></script>
    <script src="src/engine/equipment.js"></script>
    <script src="src/engine/loot.js"></script>
    <script src="src/engine/realtime.js"></script>
    <script src="src/engine/action.js"></script>
    <script src="src/engine.js"></script>
    <!-- World (no DOM) -->
    <script src="src/world/world.js"></script>
    <script src="src/world/tiled.js"></script>
    <script src="src/world/scale16.js"></script>
    <script src="src/world/chapter1-maps.js"></script>
    <script src="src/world/zone1.js"></script>
    <script src="src/action/sim.js"></script>
    <!-- Front end -->
    <script src="assets/sprites/player-placeholder.js"></script>
    <script src="assets/sprites/player-pose-art.js"></script>
    <script src="assets/sprites/sable-hair-collection.js"></script>
    <script src="assets/sprites/manaseed.js"></script>
    <script src="ui/sprites.js"></script>
    <script src="assets/packed/assets.js"></script>
    <script src="ui/atlas.js"></script>
    <script src="ui/tiles-hd.js"></script>
    <script src="ui/tiles-manaseed.js"></script>
    <script src="ui/battle-hd.js"></script>
    <script src="ui/world-render.js"></script>
    <script src="ui/postfx.js"></script>
    <script src="ui/action-fx.js"></script>
    <script src="ui/combat-fx.js"></script>
    <script src="ui/battle-menu.js"></script>
    <script src="ui/battle-view.js"></script>
    <script src="ui/battle-realtime.js"></script>
    <script src="ui/skill-icons.js"></script>
    <script src="ui/action-hud.js"></script>
    <script src="ui/display.js"></script>
    <script src="ui/main-menu.js"></script>
    <script src="ui/crow-view.js"></script>
    <script src="ui/world-ui.js"></script>
</body>
</html>
