name: "Canvas UI/UX Agent"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Task or instructions for Canvas"
        required: true
        default: "Implement combat HUD and UI refinements"

permissions:
  contents: write
  pull-requests: write
  issues: write

# One Canvas run per issue at a time (a second /canvas waits instead of racing the first).
concurrency:
  group: canvas-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  run-canvas:
    # The repo is public: only the owner and collaborators may start the agent (it spends the Gemini key
    # and writes files). Label events already need triage rights on the repo.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:canvas') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/canvas') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Canvas Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual Canvas Task' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          DISPATCH_PROMPT: ${{ github.event.inputs.task_prompt || '' }}
          CANVAS_RESULT: ${{ runner.temp }}/canvas_result.md
        run: python .github/scripts/canvas_runner.py

      # PRs opened with GITHUB_TOKEN do not trigger the "tests" workflow, so run the suite here.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests on Canvas's changes
        run: npm test

      - name: Commit Changes & Create Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          git config --global user.name "Canvas [Agent]"
          git config --global user.email "canvas-agent@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "Canvas completed without creating file changes." | tee -a "$RUNNER_TEMP/canvas_result.md"
            exit 0
          fi

          BRANCH_NAME="canvas/patch-${ISSUE_NUMBER:-manual}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "ui: Canvas update${ISSUE_NUMBER:+ for #$ISSUE_NUMBER}"
          git push origin "$BRANCH_NAME"

          BODY="Automated UI/UX change generated by Canvas (Gemini).${ISSUE_NUMBER:+ For #$ISSUE_NUMBER.}

          \`npm test\` passed inside the Canvas job (the tests workflow does not start automatically for PRs opened by the Actions token). Owner review and merge per AGENTS.md.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          URL=$(gh pr create --title "ui: Canvas update${ISSUE_NUMBER:+ for #$ISSUE_NUMBER}" --body "$BODY" --head "$BRANCH_NAME" --base main)
          echo "Pull request: $URL" | tee -a "$RUNNER_TEMP/canvas_result.md"

      # Report back on the issue whatever happened, so nobody has to dig through the Actions logs.
      - name: Report on the issue
        if: always() && github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            if [ "$OUTCOME" = "success" ]; then echo "**Canvas finished.**"; else echo "**Canvas run failed** ($OUTCOME)."; fi
            echo
            if [ -s "$RUNNER_TEMP/canvas_result.md" ]; then echo '```'; cat "$RUNNER_TEMP/canvas_result.md"; echo '```'; fi
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
