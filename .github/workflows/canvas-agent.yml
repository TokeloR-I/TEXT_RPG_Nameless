name: "Canvas UI/UX Agent"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Task or instructions for Canvas"
        required: true
        default: "Implement the combat HUD and D1-D3 specs"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-canvas:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:canvas') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/canvas'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Run Canvas Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual Canvas Task' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          DISPATCH_PROMPT: ${{ github.event.inputs.task_prompt || '' }}
        run: |
          python .github/scripts/canvas_runner.py

      - name: Commit Changes & Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number || 'manual' }}
        run: |
          git config --global user.name "Canvas [Agent]"
          git config --global user.email "canvas-agent@users.noreply.github.com"
          
          BRANCH_NAME="canvas/patch-issue-${ISSUE_NUM}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes were generated by Canvas."
            exit 0
          fi
          
          git commit -m "feat(ui): Canvas autonomous update for #${ISSUE_NUM}"
          git push origin "$BRANCH_NAME"
          
          gh pr create \
            --title "feat(ui): Canvas implementation for #${ISSUE_NUM}" \
            --body "Automated UI/UX implementation generated by Canvas (Gemini Agent). Resolves #${ISSUE_NUM}." \
            --head "$BRANCH_NAME" \
            --base "main"
