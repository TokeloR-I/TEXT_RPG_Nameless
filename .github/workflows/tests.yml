name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: npm test
      - name: Pending design decisions (informational)
        run: npm run pending
      - name: Balance snapshot (informational)
        run: npm run balance -- --runs 30
      - name: Single-file build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: EnsosLastStand-playable
          path: dist/*.html
